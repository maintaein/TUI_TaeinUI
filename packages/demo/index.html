<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TUI - TaeinUI</title>

    <!-- Content Security Policy -->
    <!-- script-src: unsafe-eval은 useCodeEval의 new Function()에 필요. -->
    <!-- 위험한 전역(window/document/localStorage 등)은 useCodeEval에서 shadowing으로 차단. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self';" />

    <!-- SEO -->
    <meta name="description" content="TUI(TaeinUI)는 컴포넌트마다 다른 움직임을 갖는 React UI 컴포넌트 라이브러리입니다. 모션은 GSAP이 주도하고, 시인성·가독성·가시성은 어디서도 낮추지 않습니다." />
    <meta name="keywords" content="component library, react, typescript, gsap, motion, animation, vanilla extract, 컴포넌트 라이브러리, 접근성, a11y" />
    <meta name="author" content="Taein" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tds-demo.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TUI - TaeinUI" />
    <meta property="og:description" content="컴포넌트마다 다른 움직임을 갖는 React UI 컴포넌트 라이브러리. GSAP 모션과 라이브 프리뷰를 직접 만져볼 수 있습니다." />
    <meta property="og:url" content="https://tds-demo.vercel.app/" />
    <meta property="og:site_name" content="TUI - TaeinUI" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:image" content="https://tds-demo.vercel.app/images/tds-hero.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TUI - TaeinUI" />
    <meta name="twitter:description" content="컴포넌트마다 다른 움직임을 갖는 React UI 컴포넌트 라이브러리. 모션은 GSAP이 주도합니다." />
    <meta name="twitter:image" content="https://tds-demo.vercel.app/images/tds-hero.webp" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Theme color -->
    <meta name="theme-color" content="#2563EB" />

    <!-- Font preload: critical Pretendard font -->
    <link rel="preload" href="/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Google Fonts: non-blocking load (Outfit은 ErrorPage 전용) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
